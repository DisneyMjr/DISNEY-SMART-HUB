name: Gerar DISNEY-SMART-HUB Windows e Linux
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - main.py
      - apps.json
      - requirements.txt
      - .github/workflows/smart-hub-build.yml
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Gerar executavel Windows
        run: pyinstaller --noconfirm --clean --windowed --onefile --name DisneySmartHub --add-data "apps.json;." main.py
      - uses: actions/upload-artifact@v4
        with:
          name: DisneySmartHub-Windows-x64
          path: dist/DisneySmartHub.exe
          if-no-files-found: error
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar bibliotecas e dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0
          python -m pip install -r requirements.txt
      - name: Gerar executavel Linux
        run: pyinstaller --noconfirm --clean --onefile --windowed --name DisneySmartHub --add-data "apps.json:." main.py
      - name: Empacotar versao portatil
        run: tar -czf DisneySmartHub-Linux-x64.tar.gz -C dist DisneySmartHub
      - uses: actions/upload-artifact@v4
        with:
          name: DisneySmartHub-Linux-x64
          path: DisneySmartHub-Linux-x64.tar.gz
          if-no-files-found: error
